{% extends 'base.html' %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-7 mx-auto">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="fw-bold text-primary mb-3">Secure Checkout</h2>
            <p class="text-muted">Complete your payment details to enroll in the selected tech track.</p>
            <hr class="mb-4">

            
            <form method="POST" action="{% url 'payments:receipt' 1024 %}" onsubmit="event.preventDefault(); window.location.href = this.action;">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="cardholder" class="form-label fw-semibold">Cardholder Name</label>
                    <input type="text" class="form-control" id="cardholder" placeholder="Enter full name" required>
                </div>

                <div class="mb-3">
                    <label for="cardnumber" class="form-label fw-semibold">Card Number</label>
                    <input type="text" class="form-control" id="cardnumber" placeholder="1234 5678 9012 3456" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="expiry" class="form-label fw-semibold">Expiry Date</label>
                        <input type="text" class="form-control" id="expiry" placeholder="MM/YY" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="cvv" class="form-label fw-semibold">CVV</label>
                        <input type="password" class="form-control" id="cvv" placeholder="123" required>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Confirm Payment</button>
                    <a href="{% url 'courses:list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
