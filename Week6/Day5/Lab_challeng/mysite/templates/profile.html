{% extends 'base.html' %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm border-0 p-4">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-3" style="width: 70px; height: 70px;">
                    TH
                </div>
                <div class="ms-3">
                    <h2 class="fw-bold text-primary mb-0">User Profile</h2>
                    <p class="text-muted mb-0">Manage your account information and preferences</p>
                </div>
            </div>
            <hr class="mb-4">

            <div class="mb-3">
                <label class="form-label fw-semibold text-muted">Username</label>
                <p class="fs-5 text-dark">TechHub_User</p>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-muted">Email Address</label>
                <p class="fs-5 text-dark">user@techhub.edu</p>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-muted">Account Role</label>
                <p><span class="badge bg-primary">Enrolled Student</span></p>
            </div>

            <div class="d-flex gap-3 mt-4">
                <a href="{% url 'dashboard:home' %}" class="btn btn-primary px-4">Back to Dashboard</a>
                <a href="{% url 'users:login' %}" class="btn btn-outline-danger px-4">Logout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
