<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Library{% endblock %}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b1120; color: #f3f4f6; margin: 0; }
        nav { background: rgba(11, 17, 32, 0.9); padding: 20px; text-align: center; border-bottom: 2px solid #f3f4f6; }
        nav a { color: #e5e7eb; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { color: #f3f4f6; }
        .container { padding: 40px; max-width: 800px; margin: auto; }
    </style>
</head>
<body>

    <!-- 7. Navigation Menu -->
    <nav>
        <a href="/">Main Home books</a>
    </nav>

    <div class="container">
        <!-- Child templates will inject their content here -->
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
