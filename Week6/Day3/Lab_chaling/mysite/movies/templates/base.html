{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie Rating Website{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'CSS/styles.css' %}">
</head>
<body>
    <header>
        <div class="logo-group">
            <h2>NY Reviews</h2>
            <img src="{% static 'images/black and white film.gif' %}" alt="NY Reviews Logo">
        </div>
        <nav>
            <ul>
                <li><a href="{% url 'movie_list' %}#hero">Home</a></li>
                <li><a href="{% url 'movie_list' %}#About">About Me</a></li>
                <li><a href="{% url 'movie_list' %}#movies">Movies</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer id="contact">
        <h2>Contact Us</h2>
        <form action="#" method="POST">
            <label for="name">Name:</label> 
            <input type="text" id="name" name="user_name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="user_email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="user_message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>
        <ul>
            <li><a href="https://github.com/Nassir-q" target="_blank"><span>🔗</span>Github</a></li>
            <li><a href="mailto:nasser.y.q@gmail.com"><span>✉️</span>Email</a></li>
        </ul>
    </footer>
</body>
</html>
