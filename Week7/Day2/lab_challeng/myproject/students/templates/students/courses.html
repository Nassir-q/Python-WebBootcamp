{% extends 'base.html' %}

{% block title %}Our Courses{% endblock %}

{% block content %}
    <h1>Available Courses</h1>
    <div class="cards-container">
        {% for course in courses %}
           
            {% include 'students/course_card.html' with course=course %}
        {% empty %}
            <p>No courses available at the moment.</p>
        {% endfor %}
    </div>
{% endblock %}
